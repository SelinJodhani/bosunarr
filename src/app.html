<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#141218" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon.svg" />
		<title>Bosunarr</title>
		<script>
			// Apply saved appearance before first paint (no theme flash).
			try {
				const a = JSON.parse(localStorage.getItem('appearance') || '{}');
				if (a.scheme && a.scheme !== 'system') document.documentElement.dataset.scheme = a.scheme;
				if (a.seed) document.documentElement.style.setProperty('--m3v-source', a.seed);
			} catch {}
			// First-paint status bar colour for the active scheme (the layout then syncs the exact surface colour).
			try {
				const s = document.documentElement.dataset.scheme;
				const dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#141218' : '#fef7ff');
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
