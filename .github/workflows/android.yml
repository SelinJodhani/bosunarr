name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['v*']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.2 build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF#refs/tags/v}"; else NAME="0.0.${GITHUB_RUN_NUMBER}-ci"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "BOSUNARR_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "BOSUNARR_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.BOSUNARR_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BOSUNARR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          BOSUNARR_KEYSTORE_PASSWORD: ${{ secrets.BOSUNARR_KEYSTORE_PASSWORD }}
          BOSUNARR_KEY_ALIAS: ${{ secrets.BOSUNARR_KEY_ALIAS }}
          BOSUNARR_KEY_PASSWORD: ${{ secrets.BOSUNARR_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/bosunarr-${{ steps.v.outputs.name }}.apk"
          (cd out && sha256sum *.apk | tee SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: bosunarr-apk
          path: android/out/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/*.apk out/SHA256SUMS.txt \
            --title "Bosunarr ${GITHUB_REF_NAME}" --generate-notes --latest
